<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="weather-app">
            <div class="header">
                <h1>Weather App</h1>
                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search for a city..." 
                        autocomplete="off"
                    >
                    <button id="searchBtn">Search</button>
                </div>
            </div>

            <div class="weather-display">
                <div id="loading" class="loading hidden">Loading...</div>
                <div id="error" class="error hidden"></div>
                
                <div id="weatherContent" class="weather-content hidden">
                    <div class="city-info">
                        <h2 id="cityName"></h2>
                        <p id="date"></p>
                    </div>

                    <div class="current-weather">
                        <div class="temperature-section">
                            <div class="temperature">
                                <span id="temp"></span>°C
                            </div>
                            <div class="weather-icon">
                                <img id="weatherIcon" src="" alt="weather icon">
                            </div>
                        </div>
                        <div class="weather-description">
                            <p id="description"></p>
                            <p id="feelsLike"></p>
                        </div>
                    </div>

                    <div class="weather-details">
                        <div class="detail-card">
                            <span class="detail-label">Humidity</span>
                            <span class="detail-value" id="humidity">-</span>
                        </div>
                        <div class="detail-card">
                            <span class="detail-label">Wind Speed</span>
                            <span class="detail-value" id="windSpeed">-</span>
                        </div>
                        <div class="detail-card">
                            <span class="detail-label">Pressure</span>
                            <span class="detail-value" id="pressure">-</span>
                        </div>
                        <div class="detail-card">
                            <span class="detail-label">UV Index</span>
                            <span class="detail-value" id="uvIndex">-</span>
                        </div>
                    </div>

                    <div class="forecast-section">
                        <h3>5-Day Forecast</h3>
                        <div class="forecast-container" id="forecastContainer"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
